
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Zenilda</title>
<style>
body{background:#fff0f5;font-family:Arial;text-align:center;padding:15px}
.foto{width:300px;display:block;margin:20px auto;background:white;border-radius:20px}
h1{color:#ff1493;font-size:45px;font-weight:bold}
label{font-size:30px;display:block;margin:20px;font-weight:bold}
.total{font-size:38px;color:#d81b60;font-weight:bold;margin:25px;background:white;padding:15px;border-radius:15px}
input,select{font-size:26px;padding:18px;border-radius:15px;border:3px solid #ffb6c1;width:90%;max-width:400px;margin:12px auto;display:block}
button{background:#20b2aa;color:white;font-size:28px;padding:22px 40px;border:none;border-radius:40px;margin-top:25px;font-weight:bold}
</style>
</head>
<body>
<img class="foto" src="75-751115_gorgeus-clipart-womens-hair-imagens-cabeleireiro-png.png">
<h1>Agenda Zenilda</h1>
<label><input type="checkbox" id="corte" onchange="calc()"> Corte R$80</label>
<label><input type="checkbox" id="prog" onchange="calc()"> Progressiva R$180</label>
<div class="total" id="total">Total: R$ 0</div>
<input type="date" id="data">
<select id="hora"><option>Escolha horário</option><option>08:00</option><option>09:00</option><option>10:00</option><option>14:00</option><option>15:00</option></select>
<button onclick="zap()">Agendar no WhatsApp</button>
<script>
function calc(){let t=0;if(document.getElementById('corte').checked)t+=80;if(document.getElementById('prog').checked)t+=180;document.getElementById('total').innerText='Total: R$ '+t;}
function zap(){let s='';if(document.getElementById('corte').checked)s+=' Corte';if(document.getElementById('prog').checked)s+=' Progressiva';let m=`Olá Zenilda! Quero agendar:${s} - ${document.getElementById('total').innerText} Dia:${document.getElementById('data').value} Hora:${document.getElementById('hora').value}`;window.open('https://wa.me/5549999999999?text='+encodeURIComponent(m));}
</script>
</body>
</html>
