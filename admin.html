<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agenda ADM</title>
<style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:10px}th{background:#e75480;color:white}</style>
</head><body><h2>Agenda Completa - Zenilda</h2><table id="tabela"><tr><th>Data</th><th>Hora</th><th>Nome</th><th>Whats</th></tr></table>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { databaseURL: "https://agenda-zenilda-default-rtdb.firebaseio.com" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
onValue(ref(db, 'agendamentos'), (snap)=>{
  document.getElementById('tabela').innerHTML='<tr><th>Data</th><th>Hora</th><th>Nome</th><th>Whats</th></tr>';
  snap.forEach(c=>{let a=c.val(); document.getElementById('tabela').innerHTML+=`<tr><td>${a.data}</td><td>${a.hora}</td><td>${a.nome}</td><td>${a.tel}</td></tr>`});
});
</script></body></html>
